name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting, Code Formatting & Static Type Analysis
  # ----------------------------------------------------------------------------
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Run Ruff Lint
        run: |
          ruff check backend

      - name: Run Ruff Format Check
        run: |
          ruff format --check backend

      - name: Run MyPy Type Check
        run: |
          cd backend && mypy app

  # ----------------------------------------------------------------------------
  # Job 2: Security & Vulnerability Audits
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Run Bandit Security Scanner
        run: |
          cd backend && bandit -r app/ -s B106,B107

      - name: Run pip-audit Dependency Vulnerability Scan
        run: |
          pip-audit

  # ----------------------------------------------------------------------------
  # Job 3: Unit & Integration Pytest Suite
  # ----------------------------------------------------------------------------
  tests:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Run Pytest Suite with Coverage
        run: |
          cd backend && pytest -v --cov=app --cov-report=term-missing

  # ----------------------------------------------------------------------------
  # Job 4: Live Stack Execution & Postman E2E Verification
  # ----------------------------------------------------------------------------
  api-live-e2e:
    name: Live Docker Stack & Postman E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Launch Full Docker Stack (FastAPI + PostgreSQL + Redis)
        run: |
          docker compose up --build -d

      - name: Wait for API Health Probes & Auto-Seeding
        run: |
          echo "Waiting for API to become healthy on port 8000..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/api/v1/health > /dev/null; do sleep 2; done'
          echo "Backend service is live!"
          
          echo "Verifying database connectivity and latency..."
          timeout 30 bash -c 'until curl -sf http://localhost:8000/api/v1/health/database > /dev/null; do sleep 2; done'
          echo "PostgreSQL database is connected!"

      - name: Verify Live Endpoints
        run: |
          echo "=== Health Response ==="
          curl -s http://localhost:8000/api/v1/health | jq .
          echo "=== Database Health Response ==="
          curl -s http://localhost:8000/api/v1/health/database | jq .
          echo "=== OpenAPI JSON Probe ==="
          curl -s http://localhost:8000/openapi.json | jq .info

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman (Postman CLI)
        run: npm install -g newman

      - name: Run Postman Collection E2E Suite
        run: |
          newman run postman_collection.json --bail

      - name: Print Docker Logs on Failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose logs backend --tail 100
          echo "=== Postgres Logs ==="
          docker compose logs postgres --tail 50
          echo "=== Redis Logs ==="
          docker compose logs redis --tail 50

      - name: Graceful Teardown
        if: always()
        run: |
          docker compose down -v
