[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-backend"
version = "0.1.0"
description = "Production-grade Backend API for Restaurant Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Restaurant Platform Engineering Team" }]
keywords = ["fastapi", "restaurant", "sqlalchemy", "asyncpg", "alembic", "neon"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.18",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ------------------------------------------------------------------------------
# Ruff Configuration
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
cache-dir = "/tmp/.ruff_cache"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by ruff format
    "B008", # function calls in argument defaults (FastAPI Depends)
    "B904", # raise from
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ------------------------------------------------------------------------------
# MyPy Configuration
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
cache_dir = "/tmp/.mypy_cache"
plugins = ["pydantic.mypy"]
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers -p no:cacheprovider"

# ------------------------------------------------------------------------------
# Bandit Security Scan Configuration
# ------------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101", "B106", "B107"] # ignore asserts and false-positive password keyword matches for token types
